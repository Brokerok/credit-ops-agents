[project]
name = "credit-ops-agents"
version = "0.1.0"
description = "Agentic intake and risk pre-screening for car-collateral loans: Pydantic AI agents, role-aware RAG over credit policy, FastAPI, pgvector, evals."
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai,anthropic]>=2.60",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.5",
    "numpy>=1.26",
    "pypdf>=5.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "langgraph>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
obs = ["logfire[fastapi,sqlalchemy]>=5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "policy/*.md"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
