services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
      POSTGRES_DB: credit_ops
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://credit:credit@db:5432/credit_ops
      LLM_MODEL: ${LLM_MODEL:-ollama:llama3.1:8b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_JSON: "true"
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
